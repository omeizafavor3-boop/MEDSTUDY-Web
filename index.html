<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c30"><link rel="manifest" href="manifest.webmanifest">
<title>MEDSTUDY</title>
<style>
:root{--bg:#0b1423;--p:#132238;--p2:#1a2d46;--line:#263c57;--tx:#f4f7fb;--mut:#aab8ca;--g:#16a879}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Arial}
button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#0e1a2c;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}
.brand{font-size:25px;font-weight:850}.brand span{color:#35d6a3}.tag,.muted{color:var(--mut)}.tag{font-size:11px;margin-bottom:26px}
nav.sideNav{display:grid;gap:6px}nav button{border:0;background:transparent;color:var(--mut);padding:12px;text-align:left;border-radius:11px}nav button.active,nav button:hover{background:var(--p2);color:white}
.sideNote{position:absolute;bottom:18px;color:var(--mut);font-size:12px}
main{padding:26px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}.eyebrow{color:#65d9b2;font-size:12px;letter-spacing:1.3px;font-weight:700}h1{font-size:clamp(26px,4vw,36px);margin:4px 0}h2{font-size:21px;margin:0 0 12px}h3{margin:0 0 8px}.pill{background:#163d38;color:#81e6c5;padding:7px 11px;border-radius:30px;font-size:12px;height:max-content}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card,.hero{border:1px solid var(--line);border-radius:18px;padding:19px;background:var(--p)}.hero{grid-column:span 12;background:linear-gradient(120deg,#123d3b,#183451);border-color:#28645c}.hero p{max-width:650px;color:#d0e8e4}.s12{grid-column:span 12}.s6{grid-column:span 6}.s4{grid-column:span 4}
.btn{border:0;background:var(--g);color:white;padding:10px 15px;border-radius:10px;font-weight:700}.btn.alt{background:var(--p2);border:1px solid var(--line)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:110px;padding:13px;border-radius:13px;background:#0f1d30;border:1px solid var(--line)}.stat strong{display:block;font-size:24px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px}.course,.topic{background:#102039;border:1px solid var(--line);border-radius:13px;padding:15px}.course{cursor:pointer}.course:hover{border-color:#399d83}.code{color:#6de0b8;font-size:12px;font-weight:800}.course p,.topic p{color:var(--mut);font-size:13px;margin:5px 0}
.head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}.topic{margin:9px 0}.answers{display:grid;gap:8px}.answer{background:#102039;color:white;border:1px solid var(--line);padding:12px;border-radius:10px;text-align:left}.answer.correct{background:#123c34;border-color:var(--g)}.answer.wrong{background:#442b34;border-color:#ff7777}.feedback{padding:13px;background:#102039;border-radius:11px;margin-top:12px;color:var(--mut)}
input[type=file]{width:100%;padding:12px;background:#0f1d30;color:white;border:1px solid var(--line);border-radius:10px}.progress{height:8px;background:#263a52;border-radius:20px;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--g)}
.mobile{display:none}.foot{color:var(--mut);font-size:12px;margin-top:28px}
@media(max-width:800px){.app{display:block}.side{display:none}main{padding:19px 14px 85px}.s6,.s4{grid-column:span 12}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#0e1a2c;border-top:1px solid var(--line);z-index:4}.mobile button{font-size:11px;text-align:center;padding:8px 5px}.top{align-items:flex-start}}
</style></head><body><div class="app"><aside class="side"><div class="brand">MED<span>STUDY</span></div><div class="tag">YOUR MEDICAL STUDIES COMPANION</div><nav class="sideNav" id="nav"><button class="active" data-page="home">⌂ &nbsp; Dashboard</button><button data-page="courses">▦ &nbsp; My Courses</button><button data-page="learn">▤ &nbsp; Learning Centre</button><button data-page="exam">◷ &nbsp; Exam Simulator</button><button data-page="pdf">▧ &nbsp; AI PDF Tutor</button><button data-page="lab">⚗ &nbsp; Laboratory</button><button data-page="progress">▥ &nbsp; My Progress</button></nav><div class="sideNote">100 Level • CUSTECH<br>Expandable through 600L</div></aside><main><header class="top"><div><div class="eyebrow">CUSTECH • MEDICINE</div><h1 id="title">Welcome to MEDSTUDY</h1><div class="muted" id="sub">Your learning space, organised in one place.</div></div><span class="pill">100 LEVEL</span></header><section id="content"></section><div class="foot">MEDSTUDY starter website • Progress is saved in this browser on this device.</div></main></div>
<nav class="mobile" id="mobile"><button data-page="home" class="active">⌂<br>Home</button><button data-page="courses">▦<br>Courses</button><button data-page="exam">◷<br>Exam</button><button data-page="pdf">▧<br>PDF</button><button data-page="progress">▥<br>Progress</button></nav>
<script>
const C=[["MTH131","Elementary Mathematics I","Sets, algebra, functions, trigonometry and calculus"],["CHM131","General Chemistry I","Atomic structure, bonding, periodicity and stoichiometry"],["BIO131","General Biology I","Cells, biomolecules, genetics and classification"],["PHY131","General Physics I","Measurement, mechanics, waves and thermal physics"],["CSC131","Introduction to Computer Science","Computer systems, data and algorithms"],["GST131","Communication in English","Grammar, comprehension, writing and oral communication"]];
const T={"MTH131":["Elementary set theory","Number systems and algebra","Functions and graphs","Trigonometry","Introduction to calculus"],"CHM131":["Atomic structure","Electronic configuration","Periodic properties","Chemical bonding","Stoichiometry"],"BIO131":["Cell structure and organisation","Biological molecules","Cell division","Genetics","Classification of living things"],"PHY131":["Space, time and measurement","Vectors and scalars","Motion and mechanics","Work, energy and power","Waves and thermal physics"],"CSC131":["Computer fundamentals","Hardware and software","Data representation","Algorithms and flowcharts","Introduction to programming"],"GST131":["Grammar and usage","Comprehension","Essay writing","Oral communication","Study skills"]};
const Q=[["PHY131","Which is an SI base quantity?",["Force","Length","Energy","Pressure"],1,"Length is an SI base quantity. Force, energy and pressure are derived quantities."],["BIO131","Which organelle is a major site of aerobic ATP production?",["Ribosome","Golgi apparatus","Mitochondrion","Lysosome"],2,"Mitochondria carry out major stages of aerobic respiration."],["CHM131","Atomic number equals the number of:",["Neutrons","Protons","Protons plus neutrons","Electron shells"],1,"Atomic number is the number of protons in the nucleus."],["MTH131","If A={1,2,3} and B={3,4}, what is A ∩ B?",["{1,2,3,4}","{1,2}","{3}","{4}"],2,"Intersection contains elements common to both sets."],["CSC131","Which component performs arithmetic and logical operations?",["Monitor","ALU","Keyboard","Printer"],1,"The ALU performs arithmetic calculations and logical comparisons."],["GST131","Choose the correct subject–verb agreement.",["The students studies daily.","The student study daily.","The students study daily.","The students is studying daily."],2,"The plural subject students takes the plural verb study."]];
let P="home",course=null,quiz=[],qi=0,score=0,chosen=null,checked=false;
let S=JSON.parse(localStorage.getItem("medstudy")||'{"attempts":0,"correct":0,"topics":[]}');
function save(){localStorage.setItem("medstudy",JSON.stringify(S))}
function cards(){return `<div class="courses">${C.map(c=>`<article class="course" onclick="openCourse('${c[0]}')"><div class="code">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join("")}</div>`}
function home(){return `<div class="grid"><div class="hero"><div class="eyebrow">YOUR STUDY JOURNEY STARTS HERE</div><h2>Learn. Practise. Improve.</h2><p>Keep your 100 Level courses, topic learning, practice questions and revision progress together. The curriculum can expand as you advance.</p><button class="btn" onclick="go('courses')">Explore my courses</button></div><div class="card s12"><div class="stats"><div class="stat"><strong>${S.attempts}</strong><small>Questions attempted</small></div><div class="stat"><strong>${S.correct}</strong><small>Correct answers</small></div><div class="stat"><strong>${S.topics.length}</strong><small>Topics studied</small></div><div class="stat"><strong>6</strong><small>100L courses</small></div></div></div><div class="s12"><div class="head"><h2>Your courses</h2><button class="btn alt" onclick="go('courses')">View all</button></div>${cards()}</div><div class="card s6"><h3>Learning Centre</h3><p class="muted">Open a course and study topic by topic.</p><button class="btn alt" onclick="go('learn')">Open learning</button></div><div class="card s6"><h3>Quick practice</h3><p class="muted">Try a mixed-subject starter quiz.</p><button class="btn" onclick="start('ALL')">Start quiz</button></div></div>`}
function courses(){return `<div class="head"><h2>100 Level courses</h2><span class="pill">6 subjects</span></div>${cards()}`}
function openCourse(code){course=code;go("learn")}
function learn(){if(!course)return `<h2>Choose a course</h2>${cards()}`;let c=C.find(x=>x[0]===course);return `<button class="btn alt" onclick="course=null;draw()">← All courses</button><div class="head"><div><div class="code">${c[0]}</div><h2>${c[1]}</h2></div></div><div class="card"><p class="muted">Starter topic outline. Confirm and expand these areas using your official CUSTECH course outline and lecture notes.</p>${T[course].map((t,i)=>`<div class="topic"><b>${i+1}. ${t}</b><p>Detailed notes, examples and topic questions will be added from your course materials.</p><button class="btn alt" onclick="mark('${course}:${t}')">${S.topics.includes(course+':'+t)?"Studied ✓":"Mark as studied"}</button></div>`).join("")}</div>`}
function mark(x){if(!S.topics.includes(x))S.topics.push(x);save();draw()}
function exam(){return `<div class="grid"><div class="card s6"><h2>Exam Simulator</h2><p class="muted">Choose a subject or mixed practice. Starter questions are currently available across the six subjects.</p><select id="subject" style="width:100%;padding:12px;background:#0f1d30;color:white;border:1px solid var(--line);border-radius:10px;margin:10px 0"><option value="ALL">Mixed subjects</option>${C.map(c=>`<option value="${c[0]}">${c[0]} — ${c[1]}</option>`).join("")}</select><button class="btn" onclick="start(document.getElementById('subject').value)">Start practice</button></div><div class="card s6"><h3>Starter question bank</h3><strong style="font-size:30px">${Q.length}</strong><p class="muted">Sample questions only; this is not yet a complete exam bank.</p></div></div><div id="quiz"></div>`}
function start(code){quiz=(code==="ALL"?Q:Q.filter(q=>q[0]===code)).slice().sort(()=>Math.random()-.5);if(!quiz.length){alert("No questions for this subject yet.");return}qi=0;score=0;chosen=null;checked=false;P="exam";draw();question()}
function question(){let el=document.getElementById("quiz");if(!el)return;if(qi>=quiz.length){el.innerHTML=`<div class="card" style="margin-top:16px"><h2>Practice complete</h2><h3>Score: ${score}/${quiz.length}</h3><button class="btn" onclick="go('exam')">Back to simulator</button></div>`;return}let q=quiz[qi];el.innerHTML=`<div class="card" style="margin-top:16px"><div class="muted">Question ${qi+1} of ${quiz.length} • ${q[0]}</div><h3 style="margin:16px 0">${q[1]}</h3><div class="answers">${q[2].map((a,i)=>`<button class="answer ${checked?(i===q[3]?'correct':i===chosen?'wrong':''):''}" ${checked?'disabled':''} onclick="chosen=${i};question()">${"ABCD"[i]}. ${a}</button>`).join("")}</div>${checked?`<div class="feedback">${chosen===q[3]?"Correct!":"Not quite."} ${q[4]}</div><button class="btn" style="margin-top:12px" onclick="qi++;chosen=null;checked=false;question()">Next question</button>`:`<button class="btn" style="margin-top:12px" ${chosen===null?'disabled':''} onclick="check()">Check answer</button>`}</div>`}
function check(){if(chosen===null)return;checked=true;S.attempts++;if(chosen===quiz[qi][3]){score++;S.correct++}save();question()}
function lab(){return `<div class="card"><h2>Laboratory practicals</h2>${[["BIO Laboratory","Microscopy, specimens, biological drawings and observations"],["CHM Laboratory","Apparatus, measurements, titration and qualitative analysis"],["PHY Laboratory","Measurements, apparatus, graphs, errors and experiments"]].map(x=>`<div class="topic"><h3>${x[0]}</h3><p>${x[1]}</p><p>Practical guides and question sets will be based on your actual lab manual and lecturer instructions.</p></div>`).join("")}</div>`}
function pdf(){return `<div class="grid"><div class="card s6"><div class="eyebrow">PDF STUDY WORKSPACE</div><h2>AI PDF Tutor</h2><p class="muted">Select a lecture PDF. PDF text extraction and online AI are not connected in this starter version.</p><input type="file" accept="application/pdf" id="file"><div id="status" class="feedback">No PDF selected.</div></div><div class="card s6"><h3>Planned tutor features</h3><p class="muted">Summaries, questions grounded in your notes, detailed explanations, page references and saved revision quizzes.</p></div></div>`}
function progress(){let pct=S.attempts?Math.round(100*S.correct/S.attempts):0;return `<div class="card"><h2>My Progress</h2><div class="stats"><div class="stat"><strong>${S.attempts}</strong><small>Attempted</small></div><div class="stat"><strong>${S.correct}</strong><small>Correct</small></div><div class="stat"><strong>${pct}%</strong><small>Accuracy</small></div><div class="stat"><strong>${S.topics.length}</strong><small>Topics studied</small></div></div><h3 style="margin-top:20px">Quiz accuracy</h3><div class="progress"><span style="width:${pct}%"></span></div><p class="muted">Saved in this browser on this device.</p><button class="btn alt" onclick="if(confirm('Reset saved progress?')){S={attempts:0,correct:0,topics:[]};save();draw()}">Reset progress</button></div>`}
function draw(){let data={home:["Welcome to MEDSTUDY","Your learning space, organised in one place.",home],courses:["My Courses","Your current 100 Level subjects.",courses],learn:["Learning Centre","Learn one topic at a time.",learn],exam:["Exam Simulator","Practise and review your answers.",exam],pdf:["AI PDF Tutor","Prepare your lecture materials for study.",pdf],lab:["Laboratory","BIO, CHM and PHY practical study.",lab],progress:["My Progress","Track your study activity.",progress]}[P];document.getElementById("title").textContent=data[0];document.getElementById("sub").textContent=data[1];document.getElementById("content").innerHTML=data[2]();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===P));let f=document.getElementById("file");if(f)f.onchange=()=>document.getElementById("status").textContent=f.files[0]?"Selected: "+f.files[0].name+". AI analysis is not connected yet.":"No PDF selected."}
function go(p){P=p;if(p!=="learn")course=null;draw()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));draw();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
